<h2 class="mb-4">
    Cancel Policy
  </h2>
  
  <div
    *ngIf="errorMessage"
    class="alert alert-danger">
  
    {{ errorMessage }}
  
  </div>
  
  <form
    [formGroup]="form"
    (ngSubmit)="submit()">
  
    <div class="card p-4">
  
      <div class="mb-3">
  
        <label class="form-label">
          Cancellation Date
        </label>
  
        <input
          type="date"
          class="form-control"
          formControlName="cancellationDate">
  
      </div>
  
      <div class="mb-3">
  
        <label class="form-label">
          Reason
        </label>
  
        <input
          type="text"
          class="form-control"
          formControlName="reason">
  
      </div>
  
      <div class="mb-3">
  
        <label class="form-label">
          Notes
        </label>
  
        <textarea
          class="form-control"
          rows="4"
          formControlName="notes">
        </textarea>
  
      </div>
  
      <button
        type="submit"
        class="btn btn-danger"
        [disabled]="loading">
  
        {{ loading ? 'Cancelling...' : 'Cancel Policy' }}
  
      </button>
  
    </div>
  
  </form>
