<h2 class="mb-4">
    Edit Policy
  </h2>
  
  <div
    *ngIf="errorMessage"
    class="alert alert-danger">
    {{ errorMessage }}
  </div>
  
  <form
    [formGroup]="form"
    (ngSubmit)="submit()">
  
    <div class="card p-4">
  
      <div class="mb-3">
  
        <label class="form-label">
          Customer Email
        </label>
  
        <input
          type="email"
          class="form-control"
          formControlName="customerEmail">
  
      </div>
  
      <div class="mb-3">
  
        <label class="form-label">
          Customer Phone
        </label>
  
        <input
          type="text"
          class="form-control"
          formControlName="customerPhone">
  
      </div>
  
      <div class="mb-3">
  
        <label class="form-label">
          Payment Frequency
        </label>
  
        <select
          class="form-select"
          formControlName="paymentFrequency">
  
          <option value="Monthly">
            Monthly
          </option>
  
          <option value="Quarterly">
            Quarterly
          </option>
  
          <option value="HalfYearly">
            Half Yearly
          </option>
  
          <option value="Yearly">
            Yearly
          </option>
  
        </select>
  
      </div>
  
      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="loading">
  
        {{ loading ? 'Updating...' : 'Update Policy' }}
  
      </button>
  
    </div>
  
  </form>
